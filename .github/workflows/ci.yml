name: validate

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose config
        run: docker compose config --quiet

      - name: Règles et config Prometheus
        run: |
          docker run --rm -v "$PWD/prometheus:/p" --entrypoint promtool prom/prometheus:v2.54.1 \
            check rules /p/alert.rules.yml

      - name: Config Alertmanager
        run: |
          docker run --rm -v "$PWD/prometheus:/p" --entrypoint amtool prom/alertmanager:v0.27.0 \
            check-config /p/alertmanager.yml

      - name: Scripts shell
        run: shellcheck scripts/*.sh

      - name: Python
        run: |
          pip install -r app/requirements.txt
          python -m py_compile app/*.py batch/*.py
          python -c "import json; json.load(open('grafana/dashboards/production-overview.json'))"
