filebeat.inputs:
  - type: filestream
    id: app-logs
    paths: ["/var/log/app/*.log"]
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true

  - type: filestream
    id: batch-logs
    paths: ["/var/log/batch/*.log"]
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "prod-logs-%{+yyyy.MM.dd}"

# index simple (pas de data stream) : mapping dynamique, suffisant pour le lab
setup.template.enabled: false
setup.ilm.enabled: false
